# Include this file inside the HTTPS `server { ... }` block that serves the
# KDDL Talent Transformation Platform. Do not include it in the HTTP redirect
# server: HSTS must only be returned over a valid TLS connection.
#
# `server_tokens off` suppresses the nginx version, leaving only `nginx` in
# the Server response header with a standard nginx installation.
server_tokens off;

# Start with a one-year policy for this host only. `includeSubDomains` and
# `preload` are intentionally omitted until every KDDL subdomain is confirmed
# to support HTTPS for the full HSTS lifetime.
add_header Strict-Transport-Security "max-age=31536000" always;

# This policy blocks object embedding, framing, base-URL injection and
# cross-origin form posts without restricting React/Vite scripts or styles.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The API contains Restricted-PII assessment data and must not be cached by
# browsers or intermediary proxies.
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx does not inherit `add_header` values from a parent block once a
    # location defines any header, so repeat the browser protections here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
}
